spring.application.name=bank-management-system
server.port=8080

# -------------------------------------------------------------
# DATABASE CONFIGURATION
# By default, runs seamlessly with persistent file-backed H2
# for zero-config out-of-the-box operation.
# To connect directly to MySQL server when started, uncomment below.
# -------------------------------------------------------------

# --- H2 Database (Ready out-of-the-box) ---
spring.datasource.url=jdbc:h2:file:./data/bankdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MySQL Configuration (Uncomment to use with MySQL Workbench / XAMPP) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/bankdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=update

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
